<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index 3.1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>CSV File Contents</h1>
<div id="output">Loading CSV file...</div>
<div id="table-output"></div>

<script>
  const csvFile = "connection test - Sheet1.csv";

  fetch(csvFile)
          .then(response => response.text())
          .then(csvText => {
            // Display as plain text
            document.getElementById('output').textContent = csvText;

            // Parse and display as table
            const results = Papa.parse(csvText, { header: true });
            console.log("Parsed data:", results.data);

            // Create a table from the parsed data
            displayTable(results.data);
          })
          .catch(error => {
            console.error("Error loading CSV:", error);
            document.getElementById('output').textContent = "Error loading CSV file: " + error.message;
          });

  function displayTable(data) {
    if (data.length === 0) return;

    const headers = Object.keys(data[0]);
    let tableHTML = '<table><thead><tr>';

    // Add headers
    headers.forEach(header => {
      tableHTML += `<th>${header}</th>`;
    });
    tableHTML += '</tr></thead><tbody>';

    // Add data rows
    data.forEach(row => {
      tableHTML += '<tr>';
      headers.forEach(header => {
        tableHTML += `<td>${row[header] || ''}</td>`;
      });
      tableHTML += '</tr>';
    });

    tableHTML += '</tbody></table>';
    document.getElementById('table-output').innerHTML = tableHTML;
  }
</script>
</body>
</html>
