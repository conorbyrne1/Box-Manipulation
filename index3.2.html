<body>

<div class="viewport">
  <div class="draggable-container">
    <div id="box-output"></div>
  </div>
</div>
<button class="reset-button">hello</button>
<p id="test-output">maybe</p>
<p>hello</p>

<script>
  const csvFile = "connection test - Sheet1.csv";

  fetch(csvFile)
          .then(response => response.text())
          .then(csvText => {
            // Display as plain text
            document.getElementById('output').textContent = csvText;

            // Parse and display as table
            const results = Papa.parse(csvText, { header: true });
            console.log("Parsed data:", results.data);

            // Create a table from the parsed data
            displayTable(results.data);
            displayTableBoxes(results.data);
          })
          .catch(error => {
            console.error("Error loading CSV:", error);
            document.getElementById('output').textContent = "Error loading CSV file: " + error.message;
          });

  function displayTableBoxes(data) {
    if (data.length === 0) return;

    const headers = Object.keys(data[0]);

    let boxes = ""

    for(let i = 0; i < data.length; i++) {
      //boxes += `<div class="element" style="left: ${100 + (i * 100)}px; top: ${100 + (i * 50)}px;"> ${i} </div>`
      boxes += `<div class="element"` //`style="left: ${300 - (i * 100)}px; top: ${500 - (i * 100)}px;">`
      if(i === 0)
        boxes += ` style="left: 200px; top: 300px;">`
      else if(i % 2 === 1)
        boxes += ` style="left: ${200 - (i * 200)}px; top: ${300 - (i * 200)}px;">`
      else
        boxes += ` style="left: ${200 + ((i-1) * 200)}px; top: ${300 - ((i-1) * 200)}px;">`

      boxes += `${headers[1]}: ${data[i][headers[1]]}</br>`;
      boxes += `${headers[2]}: ${data[i][headers[2]]}</br>`;
      boxes += `${headers[3]}: ${data[i][headers[3]] || 'N/A'}</br>`;
      boxes += `</div>`
    }


    
    //
    // https://www.timothyricks.com/resources/draw-line-between-two-divs
    //

    let test = ""
    // for(let i = 0; i < data[i][headers[3]].length; i++) {
    //   for(let j = 0; j < data[i][headers[1]].length; j++) {
    //     if(data[i][headers[3]] === data[i][headers[3]][j]) {
    //       test += `${data[i][headers[3]]} -> ${data[i][headers[3]][j]}`
    //     }
    //   }
    // }

    // for(let i = 0; i < data.length; i++) {
    //   for(let j = 0; j < data[i][headers[3]].length; j++) {
    //     if(data[i][headers[3]] === data[i][headers[3]][j]) {
    //       test += `${data[i][headers[3]]} -> ${data[i][headers[3]][j]}`
    //     }
    //   }
    // }

    for(let i = 0; i < data.length; i++) {
      let currentName = data[i][headers[1]]
      let relatedTo = `${data[i][headers[3]] || "N/A"}`
      test += `${currentName} is related to ${relatedTo} </br>`
    }

    document.getElementById('box-output').innerHTML = boxes;
    document.getElementById('test-output').innerHTML = test;
  }



  function displayTable(data) {
    if (data.length === 0) return;

    const headers = Object.keys(data[0]);


    let tableHTML = '<table><thead><tr>';

    // Add headers
    headers.forEach(header => {
      tableHTML += `<th>${header}</th>`;
    });
    tableHTML += '</tr></thead><tbody>';

    // Add data rows
    data.forEach(row => {
      tableHTML += '<tr>';
      headers.forEach(header => {
        tableHTML += `<td>${row[header] || ''}</td>`;
      });
      tableHTML += '</tr>';
    });

    tableHTML += '</tbody></table>';
    document.getElementById('table-output').innerHTML = tableHTML;
  }
</script>

</body>
