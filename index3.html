<body>
<input type="file" id="connection test - Sheet1.csv" />

<script>
    const csvFile = "connection test - Sheet1.csv";

    fetch(csvFile)
        .then(response => response.text())
        .then(csvText => {
            // Display as plain text
            document.getElementById('output').textContent = csvText;

            // Also parse it if you need the data
            const results = Papa.parse(csvText, { header: true });
            console.log("Parsed data:", results.data);
        })
        .catch(error => {
            console.error("Error loading CSV:", error);
            document.getElementById('output').textContent = "Error loading CSV file";
        });
</script>

</body>
</html>
